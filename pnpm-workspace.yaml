overrides:
  # postcss (via next/tailwind/vite) pins nanoid ^3.3.6; force the patched
  # version to clear GHSA-2v37-7h3g-55p8 (custom generators loop when size=0).
  nanoid: ^3.3.17
  # Patch-level fixes for remaining 2026 advisories (all via dev/tooling tree:
  # shadcn/@dotenvx/MCP-sdk and eslint chain). Reviewed; patch-only bumps.
  undici: ^7.29.0
  fast-uri: ^3.1.5
  ip-address: ^10.3.1
  brace-expansion: ^1.1.18
  js-yaml: ^4.3.1
  # In-range fixes for MCP-SDK/shadcn-tooling chain (hono <4.12.34) and
  # postcss <=8.5.22 (incomplete fix of GHSA-6g55-p6wh-862q).
  hono: ^4.12.34
  postcss: ^8.5.23

# Native-binary packages that ship postinstall scripts; reviewed and approved.
allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
